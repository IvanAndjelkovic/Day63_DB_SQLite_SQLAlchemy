<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Edit</title>
  </head>
  <body>
    <h3>Book Name: {{ book.title }}</h1>
    <h3>Current Rating: {{ book.rating }}</h1>
    <form action="/edit/{{ book.id }}" method="POST">


      <input type="text" name="rating" placeholder="New Rating"/>
      <button type="submit">Change Rating</button>
    </form>
    
  </body>
</html>
